params:
  w:
    prior:
      max: 10.0
      min: -10.0
    ref:
      dist: norm
      loc: -1
      scale: 0.02
    proposal: 0.02
    latex: w_0
    renames: ws
  wa:
    prior:
      max: 20.0
      min: -30.0
    ref:
      dist: norm
      loc: 0.0
      scale: 0.05
    proposal: 0.05
    latex: w_a
  mnu:
    prior:
      min: 0
      max: 5
    ref:
      dist: norm
      loc: 0.02
      scale: 0.1
    proposal: 0.03
    latex: \sum m_\nu
  logA:
    prior:
      min: 1.61
      max: 3.91
    ref:
      dist: norm
      loc: 3.05
      scale: 0.001
    proposal: 0.001
    drop: true
    latex: \log(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
    derived: true
  ns:
    prior:
      min: 0.8
      max: 1.2
    ref:
      dist: norm
      loc: 0.965
      scale: 0.004
    proposal: 0.002
    latex: n_\mathrm{s}
  ombh2:
    prior:
      min: 0.005
      max: 0.1
    ref:
      dist: norm
      loc: 0.0224
      scale: 0.0001
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
    renames:
    - omegabh2
  omch2:
    prior:
      min: 0.001
      max: 0.99
    ref:
      dist: norm
      loc: 0.12
      scale: 0.001
    proposal: 0.0005
    latex: \Omega_\mathrm{c} h^2
    renames:
    - omegach2
  tau:
    prior:
      dist: norm
      loc: 0.055
      scale: 0.007
    ref:
      dist: norm
      loc: 0.055
      scale: 0.006
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  theta_MC_100:
    prior:
      min: 0.5
      max: 10
    ref:
      dist: norm
      loc: 1.04109
      scale: 0.0004
    proposal: 0.0002
    latex: 100\theta_\mathrm{MC}
    drop: true
    renames: theta
  cosmomc_theta:
    value: 'lambda theta_MC_100: 1.e-2*theta_MC_100'
    derived: false
  H0:
    latex: H_0
    min: 20
    max: 100
    derived: true
  omegam:
    latex: \Omega_\mathrm{m}
    derived: true
  sigma8:
    latex: \sigma_8
    derived: true
  omegamh2:
    derived: 'lambda omegam, H0: omegam*(H0/100)**2'
    latex: \Omega_\mathrm{m} h^2
  rdrag:
    latex: r_\mathrm{drag}
    derived: true
  DHBBN:
    derived: 'lambda DH: 10**5*DH'
    latex: 10^5 \mathrm{D}/\mathrm{H}
  YHe:
    latex: Y_\mathrm{P}
    derived: true
    renames:
    - yheused
    - yhe
  age:
    latex: '{\rm{Age}}/\mathrm{Gyr}'
    derived: true
  mapTCal1:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.01
    ref: 1.0
    proposal: 0.001
    latex: T_{\mathrm cal^\mathrm{30}}
  mapTCal2:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.01
    ref: 1.0
    proposal: 0.001
    latex: T_{\mathrm cal^\mathrm{40}}
  mapTCal3:
