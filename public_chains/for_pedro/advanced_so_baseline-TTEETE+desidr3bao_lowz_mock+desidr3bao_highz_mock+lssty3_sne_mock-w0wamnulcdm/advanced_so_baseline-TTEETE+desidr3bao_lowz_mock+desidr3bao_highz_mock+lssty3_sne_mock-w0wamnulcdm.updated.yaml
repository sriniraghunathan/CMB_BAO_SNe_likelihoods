      dist: norm
      loc: 1.0
      scale: 0.01
    ref: 1.0
    proposal: 0.001
    latex: T_{\mathrm cal^\mathrm{280}}
  mapPCal1:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.01
    ref: 1.0
    proposal: 0.001
    latex: P_{\mathrm cal^\mathrm{30}}
  mapPCal2:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.01
    ref: 1.0
    proposal: 0.001
    latex: P_{\mathrm cal^\mathrm{40}}
  mapPCal3:
    prior:
      dist: norm
      loc: 1.0
      scale: 0.01
